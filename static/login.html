<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore AI - Clinical Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700/60 overflow-hidden">
        
        <!-- Header -->
        <div class="p-6 text-center bg-slate-900/50 border-b border-slate-700/50">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600/20 text-blue-400 rounded-2xl mb-3 border border-blue-500/30 shadow-lg shadow-blue-500/10">
                <i class="fa-solid font-bold fa-heart-pulse text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">MediCore AI</h1>
            <p class="text-slate-400 text-xs mt-1">Smart Clinical Triage & Patient Portal</p>
        </div>

        <!-- Toggle Tabs -->
        <div class="flex border-b border-slate-700/50 text-sm font-medium">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-3 text-center text-blue-400 border-b-2 border-blue-500 bg-slate-800/50 transition-all">Sign In</button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-3 text-center text-slate-400 hover:text-slate-200 transition-all">Register Account</button>
        </div>

        <!-- Notification Alert Box -->
        <div id="alert-box" class="hidden m-4 p-3 rounded-lg text-xs font-medium border"></div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="p-6 space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="login-email" required placeholder="doctor@medicore.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium rounded-lg text-sm shadow-lg shadow-blue-600/30 transition transform active:scale-95">
                Sign In to Dashboard
            </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" class="p-6 space-y-4 hidden" onsubmit="handleRegister(event)">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Full Name</label>
                <input type="text" id="reg-fullname" required placeholder="Suryansh Sharma" class="w-full px-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Email Address</label>
                <input type="email" id="reg-email" required placeholder="suryansh@example.com" class="w-full px-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password</label>
                <input type="password" id="reg-password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Account Role</label>
                <select id="reg-role" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
                    <option value="patient">Patient Account</option>
                    <option value="doctor">Medical Specialist / Doctor</option>
                </select>
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-medium rounded-lg text-sm shadow-lg shadow-emerald-600/30 transition transform active:scale-95">
                Create Account
            </button>
        </form>

    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            const alertBox = document.getElementById('alert-box');

            alertBox.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-3 text-center text-blue-400 border-b-2 border-blue-500 bg-slate-800/50 transition-all";
                tabReg.className = "flex-1 py-3 text-center text-slate-400 hover:text-slate-200 transition-all";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = "flex-1 py-3 text-center text-blue-400 border-b-2 border-blue-500 bg-slate-800/50 transition-all";
                tabLogin.className = "flex-1 py-3 text-center text-slate-400 hover:text-slate-200 transition-all";
            }
        }

        function showAlert(msg, isSuccess = false) {
            const box = document.getElementById('alert-box');
            box.innerText = msg;
            box.classList.remove('hidden');
            if (isSuccess) {
                box.className = "m-4 p-3 rounded-lg text-xs font-medium bg-emerald-500/10 border-emerald-500/30 text-emerald-400 border";
            } else {
                box.className = "m-4 p-3 rounded-lg text-xs font-medium bg-rose-500/10 border-rose-500/30 text-rose-400 border";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.detail || 'Login failed');

                // Synchronize localStorage keys for seamless dashboard authentication
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('user_email', data.user.email);
                localStorage.setItem('user_name', data.user.full_name);
                localStorage.setItem('user_role', data.user.role);

                showAlert('Login Successful! Redirecting...', true);
                setTimeout(() => { window.location.href = '/static/dashboard.html'; }, 800);

            } catch (err) {
                showAlert(err.message);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const full_name = document.getElementById('reg-fullname').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ full_name, email, password, role })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.detail || 'Registration failed');

                showAlert('Account created! Please sign in.', true);
                switchTab('login');

            } catch (err) {
                showAlert(err.message);
            }
        }
    </script>
</body>
</html>
